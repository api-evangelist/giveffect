name: Giveffect plans and pricing
description: >-
  Giveffect publishes three named subscription tiers on its public pricing page
  — Lite, Ultimate and Ultimate+ — sized by database records and seats. No tier
  carries a published price: every tier reads "Contact us" and routes to a
  "Schedule a Call" or "Try Now" call to action, so the money figures are
  sales-gated. The API is a tier-gated feature, not a separate product: the
  Ultimate tier is explicitly listed as "All system features (excludes open
  API)" and only Ultimate+ lists "Open API and custom integration". A row
  labelled "Open API" also appears in the plan comparison matrix on the same
  page.
