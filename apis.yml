apis:
- name: Giveffect API
  description: >-
    Giveffect's "open API" is available on the enterprise Ultimate+ plan and
    provides programmatic access to platform data (donors, donations,
    volunteers, campaigns, and events). It is explicitly carved out of the tier
    below it — the Ultimate pricing card reads "All system features (excludes
    open API)" — and only Ultimate+ lists "Open API and custom integration", so
    entitlement is a plan feature granted through sales rather than a self-serve
    signup. No public developer documentation, OpenAPI specification, SDK, or
    Postman collection is published anywhere; https://www.giveffect.com/api 302s
    to the customer sign-in page. The base host is live and JSON-native: its root
    is an operational health endpoint returning
    {"status":{"code":200,"message":"OK - Systems operational"}}, unknown paths
    return {"error":{"code":404,"message":"Not Found - Invalid resource"}}, and
    every response carries an X-Request-Id correlation uuid (Rails behind Phusion
    Passenger). Probed 2026-08-13.
  humanURL: https://www.giveffect.com/pricing
  baseURL: https://api.giveffect.com
