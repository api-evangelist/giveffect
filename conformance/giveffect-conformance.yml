    Compliant Service Provider (the highest level), which requires an annual
    independent security audit of our processes and systems." Giveffect describes
    its own donations/payments as processed "at the highest security standard -
    PCI Level 1 Compliance". The certification named belongs to the partners.
  source: https://www.giveffect.com/security
  attested_by: payment partners (PayPal, Stripe)
  certificate_published: false
