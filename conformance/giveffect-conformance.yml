source: https://www.giveffect.com/security
name: Giveffect conformance and compliance claims
description: >-
  Giveffect publishes a single public security page. It makes compliance claims
  about payments and hosting, and it is careful about attribution — the PCI DSS
  Level 1 claim is made for its payment gateway PARTNERS (PayPal, Stripe), not
  for Giveffect as a service provider. There is no trust center, no SOC 2 report,
  no ISO 27001 certificate, no HIPAA or FedRAMP claim, and no compliance
  documentation portal. On the API side nothing conforms to anything: there is no
  OpenAPI, no OAuth 2.0 or OIDC metadata, no RFC 9457 problem details, no
  RFC 8594 deprecation signalling, no standard rate-limit headers.
