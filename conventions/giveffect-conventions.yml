source: live unauthenticated HTTP probes of https://api.giveffect.com
name: Giveffect API conventions
description: >-
  Giveffect publishes no API reference, so none of the usual cross-cutting
  semantics (auth style, pagination, idempotency, versioning, error envelope,
  rate-limit signalling) are documented. What IS knowable was established by
  probing the production API host unauthenticated: api.giveffect.com is a live
  Rails/Phusion Passenger service that answers JSON on every path, wraps both
  success and failure in a consistent two-level envelope, and returns a
  per-request correlation id. Everything below is either an observed fact with
  the probe that produced it, or an explicit "not published". Nothing is
  inferred from a competitor or a template.
host: https://api.giveffect.com
stack:
  server: Apache/2.2.34 (Amazon)
  runtime: Phusion Passenger 5.0.30
  framework: Ruby on Rails (inferred from X-Runtime + Passenger + envelope shape)
  observed: '2026-08-13'
auth:
  style: not-published
  observed: >-
    No WWW-Authenticate challenge is returned on any probed path; unknown paths
    return 404 rather than 401, so the host does not advertise its auth scheme to
    an unauthenticated caller.
  provisioning: >-
    API access is provisioned per customer on the Ultimate+ enterprise plan
    (source: https://www.giveffect.com/pricing).
content_negotiation:
  request: application/json accepted on GET and POST
  response: application/json; charset=utf-8 on every probed path
  html_fallback: >-
    Only OPTIONS / returned text/html (with a 404 and Content-Length: 0);
    every other probed method/path returned JSON.
envelope:
  success:
    shape: '{"status": {"code": <int>, "message": "<string>"}}'
    example_observed: '{"status":{"code":200,"message":"OK - Systems operational"}}'
    observed_at: GET https://api.giveffect.com/
  error:
    shape: '{"error": {"code": <int>, "message": "<string>"}}'
    example_observed: '{"error":{"code":404,"message":"Not Found - Invalid resource"}}'
    observed_at: GET https://api.giveffect.com/v1/donors
    format: vendor
    rfc9457: false
    note: >-
      Not application/problem+json. The HTTP status is duplicated inside the body
      as error.code, and message is a single human string — there is no
      machine-actionable error type, no field-level detail, no documentation
      link.
tracing:
  request_id_header: X-Request-Id
  present: true
  format: uuid v4
  example_observed: 6ec596ab-5a88-49f3-9037-7a923d43fda8
  echoed_on_errors: true
  note: >-
    Returned on every probed response including 404s. This is the one runtime
    signal an integrator can quote back to support.
timing:
  header: X-Runtime
  present: true
  note: server processing seconds, e.g. 0.001910
caching:
  etag: true
  cache_control_success: max-age=0, private, must-revalidate
  cache_control_error: no-cache
security_headers:
  x_content_type_options: nosniff
  x_frame_options: SAMEORIGIN
  x_xss_protection: 1; mode=block
  strict_transport_security: false
  note: >-
    HSTS is served on www.giveffect.com (max-age 315360000) but NOT on
    api.giveffect.com — see security/giveffect-domain-security.yml.
idempotency:
  supported: unknown
  header: null
  documented: false
  note: >-
    No idempotency header is documented and none could be observed without
    credentials. NO Idempotency pointer is emitted for this provider.
pagination:
