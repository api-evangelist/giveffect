name: Giveffect API lifecycle
description: >-
  Giveffect publishes no API versioning policy, no deprecation policy, no sunset
  commitments, no SLA and no status page. What exists is a machine-readable
  health endpoint on the API host and a second one on the marketing host — both
  return a bare JSON status object with no incident history, no component
  breakdown and no subscribe option, so neither is a status page. No StatusPage
  and no Deprecation pointer is emitted from this file.
