  in_url: unknown
  note: >-
    /v1 and /v1/<resource> on api.giveffect.com return the same generic 404
    envelope as any unknown path, so a version prefix is neither confirmed nor
    denied by the public surface.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  advance_notice: null
  deprecated_operations: []
  note: >-
    No Deprecation or Sunset response header observed on any probed path; no
    deprecation policy page exists on the site or in the sitemap.
sla:
  published: false
  uptime_target: null
  note: >-
    The Ultimate+ tier promises "unlimited screen share/phone support" and a
    dedicated success manager, but no uptime or response-time commitment is
    published.
status_page:
  exists: false
  url: null
  probes:
  - url: https://status.giveffect.com/
    status: 200
    verdict: soft-404
    note: >-
      Returns HTTP 200 but renders Giveffect's "Whoops! Error 404" page. Not a
      status page. Recorded explicitly so a later pass does not credit the 200.
  - url: https://www.giveffect.com/status
    status: 200
    body: '{"status":200}'
    verdict: health-endpoint
    note: >-
      A bare health probe, and it is Disallowed in robots.txt. No incidents, no
      components, no history, no subscription.
  - url: https://api.giveffect.com/
    status: 200
    body: '{"status":{"code":200,"message":"OK - Systems operational"}}'
    verdict: health-endpoint
    note: >-
      The API root doubles as a health endpoint. This is the closest thing
      Giveffect has to an operational signal, and it is a single boolean.
